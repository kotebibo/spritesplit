[project]
name = "spritesplit"
version = "0.1.0"
description = "Decompose a pixel-art sprite into editable layers: outline, flats, shading, highlights, background."
readme = "README.md"
license = "MIT"
authors = [
    { name = "kotebibo", email = "konstantinebibilauri@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["pixel-art", "sprite", "layers", "openraster", "palette"]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.scripts]
spritesplit = "spritesplit.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: safe as argument defaults.
extend-immutable-calls = [
    "spritesplit.decompose.Params",
    "spritesplit.outline.OutlineParams",
    "spritesplit.ramps.RampParams",
]
